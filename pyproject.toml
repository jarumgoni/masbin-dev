[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datashield-sdk"
version = "1.1.0"
authors = [
  { name="masbin", email="masbin-dev@users.noreply.github.com" },
]
description = "Official Python SDK & Threat Intelligence Client for DataShield APIs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["email-verification", "fraud-detection", "disposable-email", "threat-intelligence", "rapidapi", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Email"
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[project.scripts]
datashield = "datashield.cli:main"

[project.urls]
"Homepage" = "https://prochatcommerce.com"
"Documentation" = "https://rapidapi.com/ariebintoro/api/datashield-email-verification-fraud-detection-api"
"Repository" = "https://github.com/jarumgoni/masbin-dev"
"Bug Tracker" = "https://github.com/jarumgoni/masbin-dev/issues"
